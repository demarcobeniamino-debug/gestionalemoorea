# Pubblica la cassa per Windows e Mac (con aggiornamento automatico) e l'APK Android dei palmari.
# Parte a ogni tag "v*" (es. v0.1.0) o a mano da Actions → Rilascio → Run workflow.
name: Rilascio

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path crates/ponte/Cargo.toml

  # Mac e Windows: compila, firma gli aggiornamenti e pubblica la release "vX.Y.Z"
  # con latest.json. Le casse installate la trovano da sole all'avvio.
  cassa:
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: apps/app/src-tauri }
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: apps/app
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: Cassa v__VERSION__
          releaseBody: Nuova versione della cassa. Le casse già installate la propongono da sole all'avvio.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

  palmare-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - name: Progetto Android
        working-directory: apps/app
        run: |
          npx cap add android
          npx cap sync android
      - name: APK
        working-directory: apps/app/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: palmare-android
          path: apps/app/android/app/build/outputs/apk/debug/*.apk
