[package]
name = "cassa"
version = "0.1.0"
edition = "2021"
description = "App di cassa: interfaccia + ponte verso stampanti comande ed Epson RT"

[lib]
name = "cassa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
ponte = { path = "../../../crates/ponte" }
